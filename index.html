<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>国試PDFノート穴埋め学習</title>

  <!-- iOS / iPadOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="国試ノート">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:book-open.svg?color=%232563eb&width=180&height=180">
  <meta name="theme-color" content="#2563eb">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
    <header class="border-b pb-4">
      <h1 class="text-xl font-bold text-slate-900">医師国試 PDF赤文字穴埋め</h1>
      <p class="text-sm text-slate-500 mt-1">赤文字箇所のみを即座に問題化します（軽量・高速版）。</p>
    </header>

    <!-- エラー表示バナー -->
    <div id="errorBanner" class="hidden p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg whitespace-pre-wrap leading-relaxed"></div>

    <!-- APIキー入力 -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-blue-500">
      <p class="text-[11px] text-slate-400 mt-1">※キーはお使いの端末のブラウザ内（LocalStorage）にのみ安全に保存されます。</p>
    </div>

    <!-- ファイルアップロード -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">まとめノート（PDF または 画像ファイル）</label>
      <input type="file" id="fileInput" accept="application/pdf,image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      <p class="text-[11px] text-slate-400 mt-1">※PDFまたは写真を選択してください。</p>
    </div>

    <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition disabled:bg-slate-300">
      赤文字を抽出して問題を生成する
    </button>

    <!-- 処理ステータス -->
    <div id="status" class="hidden text-sm text-center font-medium text-blue-600 animate-pulse">
      <span id="statusText">AIが赤文字を抽出中...</span>
    </div>

    <!-- 生成結果エリア -->
    <div id="resultArea" class="hidden space-y-4 pt-4 border-t border-slate-100">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-800">穴埋め問題一覧</h2>
        <span class="text-[11px] text-slate-400">※タップして答えを確認</span>
      </div>
      <div id="questionsList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const statusDiv = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const errorBanner = document.getElementById('errorBanner');
    const resultArea = document.getElementById('resultArea');
    const questionsList = document.getElementById('questionsList');

    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value));

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const res = reader.result;
          const base64String = res.substring(res.indexOf(',') + 1);
          resolve(base64String);
        };
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

        // 正確な最新APIバージョンモデル名を指定 
    const CANDIDATE_MODELS = [
      "gemini-3.8-flash", // 最新の高速・軽量モデ
    ];


    async function generateWithFallback(apiKey, requestPayload) {
      let lastError = null;

      for (const model of CANDIDATE_MODELS) {
        try {
          statusText.textContent = `モデル (${model}) で抽出中...`;
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestPayload)
          });

          if (response.ok) {
            return await response.json();
          }

          const errData = await response.json().catch(() => ({}));
          const errMsg = errData.error?.message || `HTTP ${response.status}`;
          lastError = new Error(`[${model}] ${errMsg}`);
          console.warn(`Model ${model} failed (${response.status}), falling back...`, errMsg);
        } catch (e) {
          lastError = e;
        }
      }

      throw lastError || new Error('利用可能なすべてのGeminiモデルが混雑または応答不能です。少し時間を置いて再試行してください。');
    }

    processBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      const file = fileInput.files[0];

      errorBanner.classList.add('hidden');
      errorBanner.textContent = '';

      if (!apiKey) return alert('Gemini API Keyを入力してください');
      if (!file) return alert('PDFまたは画像ファイルを選択してください');

      processBtn.disabled = true;
      statusDiv.classList.remove('hidden');
      resultArea.classList.add('hidden');
      questionsList.innerHTML = '';

      try {
        const base64Data = await fileToBase64(file);
        const mimeType = file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');

        const prompt = `
添付資料（PDF/画像）の中から、「赤色（または朱色・ピンク・赤マーカー）」で書かれている重要単語や数値を抜き出してください。
それぞれの単語について、前後の文脈を生かした穴埋め問題を作成してください。

必ず以下のJSON配列形式のみを出力してください:
[
  {
    "question": "問題文（赤文字だった箇所を【 ??? 】とする）",
    "answer": "赤文字の単語"
  }
]`;

        const payload = {
          contents: [{
            parts: [
              { text: prompt },
              {
                inlineData: {
                  mimeType: mimeType,
                  data: base64Data
                }
              }
            ]
          }],
          generationConfig: {
            responseMimeType: "application/json"
          }
        };

        const data = await generateWithFallback(apiKey, payload);
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('AIからの応答が空でした。');

        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

        let questions;
        try {
          const parsed = JSON.parse(rawText);
          questions = Array.isArray(parsed) ? parsed : (parsed.questions || []);
        } catch (parseErr) {
          throw new Error(`JSON解析失敗: ${parseErr.message}\n返却テキスト: ${rawText.substring(0, 150)}...`);
        }

        if (!questions || questions.length === 0) {
          questionsList.innerHTML = '<p class="text-xs text-slate-500">赤文字のキーワードが見つかりませんでした。</p>';
        } else {
          questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = "p-4 border rounded-xl bg-white shadow-sm space-y-2";
            card.innerHTML = `
              <div class="text-xs font-semibold text-slate-400">問題 ${idx + 1}</div>
              <div class="text-sm font-medium text-slate-800 leading-relaxed">${q.question}</div>
              
              <div class="pt-1">
                <button type="button" class="toggle-btn text-xs font-medium px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg transition">
                  答えを見る
                </button>
                <div class="answer-box hidden mt-2 p-2.5 bg-slate-50 border rounded-lg text-xs">
                  <span class="font-bold text-slate-700">正解:</span> <span class="text-rose-600 font-bold text-sm ml-1">${q.answer}</span>
                </div>
              </div>
            `;

            const btn = card.querySelector('.toggle-btn');
            const box = card.querySelector('.answer-box');
            btn.addEventListener('click', () => {
              box.classList.toggle('hidden');
              btn.textContent = box.classList.contains('hidden') ? '答えを見る' : '隠す';
            });

            questionsList.appendChild(card);
          });
        }

        resultArea.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        errorBanner.textContent = `【エラー】\n${err.message}`;
        errorBanner.classList.remove('hidden');
      } finally {
        processBtn.disabled = false;
        statusDiv.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
