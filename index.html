<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>国試PDFノート穴埋め学習</title>

  <!-- iOS / iPadOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="国試ノート">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:book-open.svg?color=%232563eb&width=180&height=180">
  <meta name="theme-color" content="#2563eb">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
    <header class="border-b pb-4">
      <h1 class="text-xl font-bold text-slate-900">医師国試 PDF穴埋め＆AI要約</h1>
      <p class="text-sm text-slate-500 mt-1">PDFまたはレジュメ画像を直接解析し、赤文字の穴埋め問題と解説を生成します。</p>
    </header>

    <!-- エラー詳細表示用バナー -->
    <div id="errorBanner" class="hidden p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg whitespace-pre-wrap leading-relaxed"></div>

    <!-- APIキー入力 -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-blue-500">
      <p class="text-[11px] text-slate-400 mt-1">※キーはお使いの端末のブラウザ内（LocalStorage）にのみ安全に保存されます。</p>
    </div>

    <!-- ファイルアップロード -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">まとめノート（PDF または 画像ファイル）</label>
      <input type="file" id="fileInput" accept="application/pdf,image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
      <p class="text-[11px] text-slate-400 mt-1">※PDFまたは写真を選択してください。</p>
    </div>

    <button id="processBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition disabled:bg-slate-300">
      赤文字を抽出して問題を生成する
    </button>

    <!-- 処理ステータス -->
    <div id="status" class="hidden text-sm text-center font-medium text-blue-600 animate-pulse">
      AIがPDF・画像を解析中...（20〜30秒ほどお待ちください）
    </div>

    <!-- 生成結果エリア -->
    <div id="resultArea" class="hidden space-y-6 pt-4 border-t border-slate-100">
      <!-- 要約 -->
      <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-4">
        <h2 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-1">知識の要約・重要ポイント</h2>
        <p id="summaryText" class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap"></p>
      </div>

      <!-- 問題一覧 -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">穴埋め問題演習</h2>
          <span class="text-[11px] text-slate-400">※タップして答えを確認</span>
        </div>
        <div id="questionsList" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const statusDiv = document.getElementById('status');
    const errorBanner = document.getElementById('errorBanner');
    const resultArea = document.getElementById('resultArea');
    const summaryText = document.getElementById('summaryText');
    const questionsList = document.getElementById('questionsList');

    // 以前のAPIキーを復元
    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    apiKeyInput.addEventListener('change', () => localStorage.setItem('gemini_api_key', apiKeyInput.value));

    // ファイルをBase64文字列に変換
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const res = reader.result;
          const base64String = res.substring(res.indexOf(',') + 1);
          resolve(base64String);
        };
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

    processBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      const file = fileInput.files[0];

      errorBanner.classList.add('hidden');
      errorBanner.textContent = '';

      if (!apiKey) return alert('Gemini API Keyを入力してください');
      if (!file) return alert('PDFまたは画像ファイルを選択してください');

      processBtn.disabled = true;
      statusDiv.classList.remove('hidden');
      resultArea.classList.add('hidden');
      questionsList.innerHTML = '';

      try {
        const base64Data = await fileToBase64(file);
        const mimeType = file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');

        const prompt = `
あなたは医師国家試験の指導医です。
添付資料（PDFまたは画像）を解析し、以下の指示に従って学習用JSONデータを作成してください。

1. 【要約】: 資料に記載されている重要医学知識（疾患概念、診断基準、病態、治療など）のエッセンスを整理してください。
2. 【穴埋め問題】: 資料内の「赤色（または朱色・ピンク）」で強調されている重要単語や数値を抜き出し、穴埋め問題を作成してください。穴埋め箇所は必ず【 ??? 】としてください。
3. 【解説】: 各問題について、医師国試で出題されやすい周辺知識や鑑別・治療などのワンポイント解説を添えてください。

必ず以下の形式のJSONのみを出力してください:
{
  "summary": "要約文",
  "questions": [
    {
      "question": "問題文（穴埋め部分は【 ??? 】）",
      "answer": "正解単語",
      "explanation": "解説文"
    }
  ]
}`;

        // Gemini 2.5 Flash にリクエスト
        // プロパティ名をREST仕様に合わせて inlineData / mimeType に修正
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: mimeType,
                    data: base64Data
                  }
                }
              ]
            }],
            generationConfig: {
              responseMimeType: "application/json"
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          const detail = errData.error?.message || JSON.stringify(errData);
          throw new Error(`APIエラー (${response.status}): ${detail}`);
        }

        const data = await response.json();
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('AIからの応答が空でした。');

        // コードブロック装飾が残っていた場合のクレンジング
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

        let output;
        try {
          output = JSON.parse(rawText);
        } catch (parseErr) {
          throw new Error(`JSON解析失敗: ${parseErr.message}\n返却テキスト: ${rawText.substring(0, 200)}...`);
        }

        // 要約を表示
        summaryText.textContent = output.summary || '要約はありません。';

        // 問題一覧を描画
        if (!output.questions || output.questions.length === 0) {
          questionsList.innerHTML = '<p class="text-xs text-slate-500">赤文字のキーワードが見つかりませんでした。</p>';
        } else {
          output.questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = "p-4 border rounded-xl bg-white shadow-sm space-y-2.5";
            card.innerHTML = `
              <div class="flex justify-between items-center text-xs font-semibold text-slate-400">
                <span>問題 ${idx + 1}</span>
              </div>
              <div class="text-sm font-medium text-slate-800 leading-relaxed">${q.question}</div>
              
              <div class="pt-2">
                <button type="button" class="toggle-btn text-xs font-medium px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg transition">
                  答え・解説を見る
                </button>
                <div class="answer-box hidden mt-3 p-3 bg-slate-50 border rounded-lg text-xs space-y-1.5">
                  <div><span class="font-bold text-slate-700">正解:</span> <span class="text-rose-600 font-bold text-sm ml-1">${q.answer}</span></div>
                  <div class="text-slate-600 leading-relaxed"><span class="font-bold text-slate-700">解説:</span> ${q.explanation}</div>
                </div>
              </div>
            `;

            const btn = card.querySelector('.toggle-btn');
            const box = card.querySelector('.answer-box');
            btn.addEventListener('click', () => {
              box.classList.toggle('hidden');
              btn.textContent = box.classList.contains('hidden') ? '答え・解説を見る' : '隠す';
            });

            questionsList.appendChild(card);
          });
        }

        resultArea.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        errorBanner.textContent = `【エラー】\n${err.message}`;
        errorBanner.classList.remove('hidden');
      } finally {
        processBtn.disabled = false;
        statusDiv.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
